name: Testes do LexiPy

on:
  push:
    branches: ["main", "feat/etapa4-analise-sintatica"]
  pull_request:
    branches: ["main"]

jobs:
  testes-python:
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Executar testes
        working-directory: backend
        env:
          PYTHONPATH: .
        run: python -m pytest -v

  validacao-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Validar configuração Compose
        run: docker compose config
      - name: Construir e iniciar serviços
        run: docker compose up --build -d
      - name: Aguardar backend saudável
        run: |
          for i in $(seq 1 20); do
            if docker compose exec -T backend python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"; then
              exit 0
            fi
            sleep 3
          done
          docker compose logs
          exit 1
      - name: Testar interface e endpoint integrado
        run: |
          curl --fail http://localhost:8080/ | grep -q 'LexiPy'
          curl --fail -X POST http://localhost:8080/api/analisar -H 'Content-Type: application/json' -d '{"codigo":"x = 2 + 3 * 4"}' | grep -q '"sintaxe_sucesso":true'
      - name: Executar testes dentro do container
        run: docker compose exec -T backend python -m pytest -v
      - name: Encerrar serviços
        if: always()
        run: docker compose down -v
